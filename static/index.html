<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Multi-Agent Orchestrator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3e;
      --accent:    #6366f1;
      --accent2:   #8b5cf6;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --success:   #10b981;
      --warning:   #f59e0b;
      --error:     #ef4444;
      --code-bg:   #0d1117;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }

    .api-key-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
    }

    .api-key-wrap label { color: var(--muted); }

    #apiKeyInput {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 12px;
      width: 180px;
      font-family: monospace;
    }

    /* ── MAIN LAYOUT ── */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    aside {
      width: 240px;
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .example-btn {
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 6px;
      transition: border-color 0.2s, background 0.2s;
      line-height: 1.4;
    }
    .example-btn:hover { border-color: var(--accent); background: rgba(99,102,241,0.05); }
    .example-btn .tag {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .tag-coding   { background: rgba(16,185,129,0.15); color: var(--success); }
    .tag-research { background: rgba(245,158,11,0.15); color: var(--warning); }
    .tag-multi    { background: rgba(99,102,241,0.15); color: var(--accent); }
    .tag-summary  { background: rgba(139,92,246,0.15); color: var(--accent2); }

    .agent-list { display: flex; flex-direction: column; gap: 6px; }

    .agent-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted);
    }
    .agent-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--border); flex-shrink: 0;
      transition: background 0.3s;
    }
    .agent-dot.active { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .agent-dot.thinking { background: var(--warning); animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── CHAT AREA ── */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── MESSAGES ── */
    .msg { display: flex; gap: 12px; max-width: 820px; }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .avatar.user-av  { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .avatar.agent-av { background: var(--surface); border: 1px solid var(--border); }

    .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 680px;
    }
    .bubble.user-bubble {
      background: rgba(99,102,241,0.1);
      border-color: rgba(99,102,241,0.3);
    }

    /* routing badge */
    .routing-badge {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
      display: flex; align-items: center; gap: 4px;
    }
    .badge.agent  { border-color: rgba(99,102,241,0.4); color: var(--accent); background: rgba(99,102,241,0.08); }
    .badge.strat  { border-color: rgba(245,158,11,0.4); color: var(--warning); background: rgba(245,158,11,0.08); }
    .badge.conf   { border-color: rgba(16,185,129,0.3); color: var(--success); background: rgba(16,185,129,0.06); }

    /* output text */
    .output-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* code blocks */
    .output-text code {
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      background: var(--code-bg);
      padding: 2px 5px;
      border-radius: 4px;
      color: #93c5fd;
    }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin: 8px 0;
    }
    pre code {
      background: transparent;
      padding: 0;
      font-size: 13px;
      color: #e2e8f0;
    }

    /* cursor blink */
    .cursor {
      display: inline-block;
      width: 2px; height: 14px;
      background: var(--accent);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* meta row */
    .msg-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex; gap: 14px; flex-wrap: wrap;
    }
    .msg-meta span { display: flex; align-items: center; gap: 4px; }

    /* status messages */
    .status-msg {
      font-size: 12px;
      color: var(--muted);
      display: flex; align-items: center; gap: 8px;
      padding: 4px 0;
    }
    .spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      text-align: center;
      padding: 40px;
    }
    .empty-state .big-icon { font-size: 48px; opacity: 0.3; }
    .empty-state h2 { font-size: 18px; color: var(--text); opacity: 0.6; }
    .empty-state p  { font-size: 13px; max-width: 360px; line-height: 1.6; }

    /* ── INPUT BAR ── */
    .input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .input-wrap {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: flex-end;
      padding: 10px 14px;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }

    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      font-family: inherit;
    }
    #msgInput::placeholder { color: var(--muted); }

    .priority-select {
      background: transparent;
      border: none;
      outline: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    .priority-select option { background: var(--surface); }

    #sendBtn {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, transform 0.1s;
      flex-shrink: 0;
    }
    #sendBtn:hover { opacity: 0.9; }
    #sendBtn:active { transform: scale(0.95); }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Error toast */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--error); color: white;
      padding: 10px 18px; border-radius: 8px; font-size: 13px;
      display: none; z-index: 999; max-width: 400px; text-align: center;
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo">
    <div class="logo-icon">🤖</div>
    AI Multi-Agent Orchestrator
  </div>
  <div class="header-right">
    <div class="status-dot" id="statusDot"></div>
    <div class="api-key-wrap">
      <label>API Key</label>
      <input id="apiKeyInput" type="password" placeholder="X-API-Key" />
    </div>
  </div>
</header>

<main>
  <!-- ── SIDEBAR ── -->
  <aside>
    <div class="sidebar-section">
      <h3>Examples</h3>
      <button class="example-btn" onclick="useExample(this)">
        <div><span class="tag tag-coding">coding</span></div>
        Write a Python binary search function
      </button>
      <button class="example-btn" onclick="useExample(this)">
        <div><span class="tag tag-research">research</span></div>
        Research the key differences between REST and GraphQL
      </button>
      <button class="example-btn" onclick="useExample(this)">
        <div><span class="tag tag-multi">multi-agent</span></div>
        Research LangGraph and write a cold email to their sales team
      </button>
      <button class="example-btn" onclick="useExample(this)">
        <div><span class="tag tag-summary">summarize</span></div>
        Summarize the benefits of vector databases for AI applications
      </button>
      <button class="example-btn" onclick="useExample(this)">
        <div><span class="tag tag-coding">coding</span></div>
        Write a FastAPI endpoint with Pydantic validation and error handling
      </button>
    </div>

    <div class="sidebar-section">
      <h3>Agents</h3>
      <div class="agent-list" id="agentList">
        <div class="agent-item" data-agent="router">
          <div class="agent-dot" id="dot-router"></div>router
        </div>
        <div class="agent-item" data-agent="research">
          <div class="agent-dot" id="dot-research"></div>research
        </div>
        <div class="agent-item" data-agent="coding">
          <div class="agent-dot" id="dot-coding"></div>coding
        </div>
        <div class="agent-item" data-agent="summarization">
          <div class="agent-dot" id="dot-summarization"></div>summarization
        </div>
        <div class="agent-item" data-agent="outreach">
          <div class="agent-dot" id="dot-outreach"></div>outreach
        </div>
        <div class="agent-item" data-agent="retrieval">
          <div class="agent-dot" id="dot-retrieval"></div>retrieval
        </div>
      </div>
    </div>
  </aside>

  <!-- ── CHAT ── -->
  <div class="chat-container">
    <div id="messages">
      <div class="empty-state" id="emptyState">
        <div class="big-icon">🧠</div>
        <h2>Multi-Agent AI System</h2>
        <p>Submit any task. The orchestrator automatically routes it to the right agents and streams the response in real time.</p>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea
          id="msgInput"
          rows="1"
          placeholder="Ask anything — code, research, emails, summaries..."
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <select class="priority-select" id="prioritySelect">
          <option value="low">low</option>
          <option value="medium" selected>medium</option>
          <option value="high">high</option>
        </select>
      </div>
      <button id="sendBtn" onclick="sendMessage()" title="Send (Enter)">↑</button>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
  // ── CONFIG ──
  const API_BASE = 'https://web-production-27b48.up.railway.app';

  // ── STATE ──
  let isStreaming = false;

  // ── INIT ──
  const savedKey = localStorage.getItem('apiKey') || '';
  document.getElementById('apiKeyInput').value = savedKey;
  document.getElementById('apiKeyInput').addEventListener('input', e => {
    localStorage.setItem('apiKey', e.target.value);
  });

  checkHealth();

  async function checkHealth() {
    try {
      const r = await fetch(`${API_BASE}/api/v1/health`);
      if (r.ok) setStatus('online');
    } catch { setStatus('offline'); }
  }

  function setStatus(s) {
    const dot = document.getElementById('statusDot');
    dot.className = 'status-dot' + (s === 'online' ? ' online' : '');
  }

  // ── UTILS ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function useExample(btn) {
    const text = btn.innerText.trim().split('\n').pop().trim();
    const input = document.getElementById('msgInput');
    input.value = text;
    autoResize(input);
    input.focus();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  function scrollBottom() {
    const m = document.getElementById('messages');
    m.scrollTop = m.scrollHeight;
  }

  function resetAgentDots() {
    document.querySelectorAll('.agent-dot').forEach(d => d.className = 'agent-dot');
  }

  function setAgentDot(name, state) {
    const dot = document.getElementById('dot-' + name);
    if (dot) dot.className = 'agent-dot ' + state;
  }

  // ── FORMAT OUTPUT ──
  function formatOutput(text) {
    // Convert markdown code blocks to <pre><code>
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${escHtml(code.trim())}</code></pre>`
    );
    // Inline code
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Convert remaining newlines
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── SEND MESSAGE ──
  async function sendMessage() {
    if (isStreaming) return;

    const input = document.getElementById('msgInput');
    const message = input.value.trim();
    if (!message) return;

    const apiKey = document.getElementById('apiKeyInput').value.trim();
    if (!apiKey) { showToast('Enter your API key in the header first'); return; }

    const priority = document.getElementById('prioritySelect').value;

    // Clear input
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('emptyState')?.remove();

    // Add user message
    addUserMessage(message);

    // Start streaming
    isStreaming = true;
    document.getElementById('sendBtn').disabled = true;
    resetAgentDots();
    setAgentDot('router', 'thinking');

    const { bubble, outputEl, metaEl, cursorEl } = addAgentMessage();
    let routingBadgesAdded = false;
    let chunkCount = 0;
    let rawText = '';
    let startTime = Date.now();

    try {
      const resp = await fetch(`${API_BASE}/api/v1/task/stream`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-API-Key': apiKey,
        },
        body: JSON.stringify({ message, priority }),
      });

      if (resp.status === 401) { showToast('Invalid API key'); cleanup(); return; }
      if (resp.status === 429) { showToast('Rate limit hit — wait a minute and retry'); cleanup(); return; }
      if (!resp.ok) { showToast(`Server error: ${resp.status}`); cleanup(); return; }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;

          let event;
          try { event = JSON.parse(raw); } catch { continue; }

          switch (event.type) {
            case 'status':
              outputEl.innerHTML = `<span style="color:var(--muted);font-size:13px">${event.message}</span>`;
              break;

            case 'routing':
              setAgentDot('router', 'active');
              if (!routingBadgesAdded) {
                const badgeRow = document.createElement('div');
                badgeRow.className = 'routing-badge';
                event.agents.forEach(a => {
                  badgeRow.innerHTML += `<span class="badge agent">🤖 ${a}</span>`;
                });
                badgeRow.innerHTML += `<span class="badge strat">⚡ ${event.strategy}</span>`;
                badgeRow.innerHTML += `<span class="badge conf">✓ ${Math.round(event.confidence * 100)}%</span>`;
                bubble.insertBefore(badgeRow, outputEl);
                routingBadgesAdded = true;
              }
              outputEl.innerHTML = '';
              rawText = '';
              break;

            case 'agent_start':
              setAgentDot(event.agent, 'thinking');
              outputEl.innerHTML = '';
              rawText = '';
              break;

            case 'chunk':
              rawText += event.text;
              chunkCount++;
              outputEl.innerHTML = formatOutput(rawText);
              outputEl.appendChild(cursorEl);
              scrollBottom();
              break;

            case 'agent_done':
              setAgentDot(event.agent, 'active');
              break;

            case 'done': {
              cursorEl.remove();
              outputEl.innerHTML = formatOutput(rawText);
              const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
              metaEl.style.display = 'flex';
              metaEl.innerHTML = `
                <span>🤖 ${event.agents_used.join(' → ')}</span>
                <span>⏱ ${elapsed}s</span>
                <span>✓ complete</span>
              `;
              event.agents_used.forEach(a => setAgentDot(a, 'active'));
              scrollBottom();
              break;
            }

            case 'error':
              cursorEl.remove();
              outputEl.innerHTML = `<span style="color:var(--error)">Error: ${escHtml(event.message)}</span>`;
              resetAgentDots();
              break;
          }
        }
      }
    } catch (err) {
      cursorEl.remove();
      outputEl.innerHTML = `<span style="color:var(--error)">Connection error: ${escHtml(err.message)}</span>`;
    }

    cleanup();
  }

  function cleanup() {
    isStreaming = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('msgInput').focus();
  }

  // ── DOM HELPERS ──
  function addUserMessage(text) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `
      <div class="avatar user-av">👤</div>
      <div class="bubble user-bubble">${escHtml(text)}</div>
    `;
    msgs.appendChild(div);
    scrollBottom();
  }

  function addAgentMessage() {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const outputEl = document.createElement('div');
    outputEl.className = 'output-text';

    const cursorEl = document.createElement('span');
    cursorEl.className = 'cursor';

    const metaEl = document.createElement('div');
    metaEl.className = 'msg-meta';
    metaEl.style.display = 'none';

    bubble.appendChild(outputEl);
    bubble.appendChild(metaEl);

    div.innerHTML = `<div class="avatar agent-av">🤖</div>`;
    div.appendChild(bubble);
    msgs.appendChild(div);
    scrollBottom();

    return { bubble, outputEl, metaEl, cursorEl };
  }
</script>
</body>
</html>
